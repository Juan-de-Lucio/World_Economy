<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Value Added Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .red {
            color: red;
            font-weight: bold;
        }
        .arrow {
            color: purple;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th></th>
                <th>Farmers</th>
                <th>Millers</th>
                <th>Bakers</th>
                <th>Shops</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Production (Output)</td>
                <td>50</td>
                <td>75</td>
                <td>105</td>
                <td><b>115</b></td>
                <td>= 345</td>
            </tr>
            <tr>
                <td>Intermediate Consumption</td>
                <td>-</td>
                <td><span class="arrow">→</span> 50</td>
                <td><span class="arrow">→</span> 75</td>
                <td><span class="arrow">→</span> 105</td>
                <td>= 230</td>
            </tr>
            <tr>
                <td class="red">Value Added (VA) or GDP</td>
                <td class="red">50</td>
                <td class="red">25</td>
                <td class="red">30</td>
                <td class="red">10</td>
                <td class="red">= 115</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
