<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gini Coefficient Calculator with Lorenz Curve</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .container { width: 60%; margin: auto; padding: 20px; }
        input { width: 300px; text-align: center; margin: 10px; padding: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #000; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        .result { font-weight: bold; font-size: 1.2em; margin-top: 20px; }
        canvas { margin-top: 20px; max-width: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Gini Coefficient Calculator with Lorenz Curve</h2>
        <p>Generated incomes (editable):</p>
        <input type="text" id="incomeInput">
        <button onclick="generateRandomIncomes()">Generate Random Incomes</button>
        <button onclick="calculateGini()">Calculate</button>

        <table id="resultTable">
            <thead>
                <tr>
                    <th>Individual</th>
                    <th>Income</th>
                    <th>Cumulative Income</th>
                    <th>Cumulative Income Share (Qᵢ %)</th>
                    <th>Cumulative Population Share (P %)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="result" id="giniResult"></div>

        <h3>Lorenz Curve</h3>
        <canvas id="lorenzCurve"></canvas>
    </div>

    <script>
        function getRandomNumber(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateRandomIncomes() {
            let numIndividuals = getRandomNumber(2, 10);
            let incomes = [];
            for (let i = 0; i < numIndividuals; i++) {
                incomes.push(getRandomNumber(1000, 20000));
            }
            document.getElementById('incomeInput').value = incomes.join(", ");
            calculateGini();
        }

        function calculateGini() {
            let incomeStr = document.getElementById('incomeInput').value;
            let incomes = incomeStr.split(',').map(num => parseFloat(num.trim())).filter(num => !isNaN(num));

            if (incomes.length < 2) {
                alert("Please enter at least two values.");
                return;
            }

            incomes.sort((a, b) => a - b);
            let n = incomes.length;
            let totalIncome = incomes.reduce((sum, val) => sum + val, 0);
            let cumulativeIncome = 0;
            let cumulativeIncomeShares = [0];  // Include (0,0)
            let cumulativePopulationShares = [0];  // Include (0,0)
            let tableBody = document.querySelector("#resultTable tbody");
            tableBody.innerHTML = "";

            for (let i = 0; i < n; i++) {
                cumulativeIncome += incomes[i];
                let q = cumulativeIncome / totalIncome;
                let p = (i + 1) / n;
                cumulativeIncomeShares.push(q);
                cumulativePopulationShares.push(p);

                let row = `<tr>
                    <td>${i + 1}</td>
                    <td>${incomes[i]}</td>
                    <td>${cumulativeIncome}</td>
                    <td>${(q * 100).toFixed(2)}%</td>
                    <td>${(p * 100).toFixed(2)}%</td>
                </tr>`;
                tableBody.innerHTML += row;
            }

            // Corrected Gini Index Calculation
            let giniNumerator = 0;
            let giniDenominator = 0;
            for (let i = 1; i < n; i++) {
                giniNumerator += Math.abs(cumulativePopulationShares[i] - cumulativeIncomeShares[i]);
                giniDenominator += cumulativePopulationShares[i];
            }
            let gini = giniNumerator / giniDenominator;

            document.getElementById("giniResult").innerHTML = `Gini Coefficient: <strong>${gini.toFixed(4)}</strong>`;

            drawLorenzCurve(cumulativePopulationShares, cumulativeIncomeShares);
        }

        function drawLorenzCurve(populationShares, incomeShares) {
            let ctx = document.getElementById("lorenzCurve").getContext("2d");

            if (window.lorenzChart) {
                window.lorenzChart.destroy();
            }

            window.lorenzChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: populationShares.map(p => (p * 100).toFixed(2) + "%"),
                    datasets: [
                        {
                            label: "Lorenz Curve",
                            data: incomeShares.map(q => q * 100),
                            borderColor: "blue",
                            fill: false
                        },
                        {
                            label: "Perfect Equality",
                            data: populationShares.map(p => p * 100),
                            borderColor: "red",
                            borderDash: [5, 5],
                            fill: false
                        }
                    ]
                },
                options: {
                    scales: {
                        x: { title: { display: true, text: "Cumulative Population (%)" } },
                        y: { title: { display: true, text: "Cumulative Income (%)" }, beginAtZero: true, max: 100 }
                    }
                }
            });
        }

        window.onload = generateRandomIncomes;
    </script>

</body>
</html>
