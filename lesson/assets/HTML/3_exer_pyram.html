<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pirámide de Población Interactiva</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #controls {
      margin-bottom: 20px;
    }
    label {
      margin-right: 10px;
    }
    .control-group {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Pirámide de Población Interactiva</h1>
  <div id="controls">
    <div class="control-group">
      <label for="alphaSlider">Tasa de Mortalidad: Baja</label>
      <input type="range" id="alphaSlider" min="0.1" max="0.6" step="0.01" value="0.1">
      <span style="display: inline-block; width: 50px; text-align: left;">Alta</span>
      <span style="float: right;"></span>
    </div>
    <div class="control-group">
      <label for="bSlider">Tasa de Natalidad, disminución entre generaciones: Baja</label>
      <input type="range" id="bSlider" min="0.5" max="5" step="0.05" value="0.2">
      <span style="display: inline-block; width: 50px; text-align: left;">Alta</span>
      <span style="float: right;"></span>
    </div>
  </div>
  <div id="chart" style="width: 800px; height: 600px;"></div>
  
  <script>
    function generatePopulation(nGroups, initialPop, alpha, b) {
      var pop = [];
      for (var i = 0; i < nGroups; i++) {
        let factor = 1 + b * Math.sin((Math.PI * i) / (nGroups - 1)); // Crece hasta la mitad y luego decrece
        pop.push(initialPop * Math.exp(-alpha * i) * factor);
      }
      return pop.reverse(); // Invertir el orden de los valores de población
    }
    
    function updateChart() {
      var alphaSlider = document.getElementById("alphaSlider");
      var bSlider = document.getElementById("bSlider");
      var alphaCustom = parseFloat(alphaSlider.value);
      var bCustom = parseFloat(bSlider.value);
      
      var nAgeGroups = 21;
      var ageLabels = [];
      for (var i = 0; i < nAgeGroups - 1; i++) {
        ageLabels.push((i * 5) + "-" + ((i * 5) + 4));
      }
      ageLabels.push("100+");
      ageLabels.reverse(); // Invertir el orden de las etiquetas de edad
      
      var maleInitial = 1000;
      var femaleInitial = 950;
      
      var popMale = generatePopulation(nAgeGroups, maleInitial, alphaCustom, bCustom);
      var popFemale = generatePopulation(nAgeGroups, femaleInitial, alphaCustom, bCustom);
      
      var popMaleNeg = popMale.map(function(val) { return -val; });
      
      var traceMale = {
        x: popMaleNeg,
        y: ageLabels,
        name: "Hombres",
        type: "bar",
        orientation: "h",
        marker: { color: "blue" }
      };
      
      var traceFemale = {
        x: popFemale,
        y: ageLabels,
        name: "Mujeres",
        type: "bar",
        orientation: "h",
        marker: { color: "red" }
      };
      
      var data = [traceMale, traceFemale];
      
      var layout = {
        title: "Pirámide de Población Personalizada",
        barmode: "overlay",
        xaxis: {
          title: "Población",
          tickvals: [-maleInitial, -maleInitial/2, 0, femaleInitial/2, femaleInitial],
          ticktext: [maleInitial, maleInitial/2, 0, femaleInitial/2, femaleInitial]
        },
        yaxis: {
          title: "Grupos de Edad",
          autorange: "reversed"
        },
        margin: { l: 100, r: 50, t: 50, b: 50 }
      };
      
      Plotly.newPlot("chart", data, layout);
    }
    
    updateChart();
    document.getElementById("alphaSlider").addEventListener("input", updateChart);
    document.getElementById("bSlider").addEventListener("input", updateChart);
  </script>
</body>
</html>
