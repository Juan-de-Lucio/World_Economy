<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>Slider de innovaciones</title>
  <style>
    body {
      background: #ffffff;
      color: #111;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Helvetica, Arial;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .card {
      width: 90%;
      max-width: 800px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 2rem;
    }
    h1 {
      text-align: center;
    }
    .meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.9rem;
      color: #555;
    }
    .big {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin: 0.5rem 0;
    }
    .title {
      text-align: center;
      font-size: 1.3rem;
      margin-bottom: 1rem;
    }
    input[type=range] {
      width: 100%;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    button, input[type=number] {
      border: 1px solid #bbb;
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      background: #f8f8f8;
      cursor: pointer;
    }
    button:hover {
      background: #eee;
    }
    .progress {
      height: 6px;
      background: #eee;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .bar {
      height: 100%;
      background: #0074d9;
      width: 0%;
      transition: width 0.2s;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Slider de innovaciones</h1>
    <div class="meta">
      <span>Posición: <b id="pos">0</b>/<b id="total">0</b></span>
      <span>Año: <b id="year">–</b></span>
      <span>Δ10 inv.: <b id="delta10">–</b> años</span>
      <span>ln(Δ10): <b id="lndelta10">–</b></span>
    </div>
    <div class="big" id="yearBig">–</div>
    <div class="title" id="name">Sin datos cargados</div>
    <div class="progress"><div class="bar" id="bar"></div></div>

    <input id="slider" type="range" min="1" max="1" value="1">

    <div class="controls">
      <button id="prev">⟵ Anterior</button>
      <button id="next">Siguiente ⟶</button>
      <button id="play">▶︎ Auto</button>
      <label>Velocidad (ms): <input id="speed" type="number" value="900" min="100" step="100" style="width:80px"></label>
    </div>
  </div>

  <script>
    const slider = document.getElementById('slider');
    const posEl = document.getElementById('pos');
    const totalEl = document.getElementById('total');
    const yearEl = document.getElementById('year');
    const yearBigEl = document.getElementById('yearBig');
    const nameEl = document.getElementById('name');
    const delta10El = document.getElementById('delta10');
    const lndelta10El = document.getElementById('lndelta10');
    const barEl = document.getElementById('bar');

    let data = [];
    let timer = null;

    function render(index){
      if(!data.length) return;
      index = Math.max(1, Math.min(index, data.length));
      slider.value = index;
      const i = index - 1;
      const row = data[i];
      posEl.textContent = index;
      totalEl.textContent = data.length;
      yearEl.textContent = row.Fecha;
      yearBigEl.textContent = row.Fecha;
      nameEl.textContent = row.Invento;
      delta10El.textContent = row.delta10!=null ? row.delta10.toFixed(0) : '—';
      lndelta10El.textContent = row.lnDelta10!=null ? row.lnDelta10.toFixed(2) : '—';
      barEl.style.width = (index * 100 / data.length) + '%';
    }

    function computeDelta10(arr){
      for(let i=0;i<arr.length;i++){
        const j = i+10;
        if(j < arr.length){
          const d = Math.abs(arr[j].Fecha - arr[i].Fecha);
          arr[i].delta10 = d;
          arr[i].lnDelta10 = d > 0 ? Math.log(d) : null;
        } else {
          arr[i].delta10 = null;
          arr[i].lnDelta10 = null;
        }
      }
    }

    document.getElementById('prev').onclick = ()=> render(parseInt(slider.value,10)-1);
    document.getElementById('next').onclick = ()=> render(parseInt(slider.value,10)+1);

    document.getElementById('play').onclick = (e)=>{
      if(timer){
        clearInterval(timer); timer=null; e.target.textContent='▶︎ Auto'; return;
      }
      const speed = Math.max(50, parseInt(document.getElementById('speed').value,10) || 900);
      e.target.textContent='⏸ Pausa';
      timer = setInterval(()=>{
        let k = parseInt(slider.value,10)+1; if(k>data.length){k=1}
        render(k);
      }, speed);
    };

    function setData(arr){
      // Validación y normalización: convertir fechas a número por si vinieran como string
      data = arr.map(r=>({
        Invento: String(r.Invento),
        Fecha: typeof r.Fecha === 'number' ? r.Fecha : parseFloat(String(r.Fecha).replace('−','-').replace(/[^0-9\-\.]/g,''))
      }))
      .filter(r=>!Number.isNaN(r.Fecha))
      .sort((a,b)=>a.Fecha-b.Fecha);
      computeDelta10(data);
      slider.min = 1;
      slider.max = data.length || 1;
      // Mostrar totales inmediatamente
      totalEl.textContent = data.length;
      render(1);
      // Mensaje en consola por si algo se descarta
      const dropped = arr.length - data.length;
      if(dropped>0){
        console.warn(`Se descartaron ${dropped} filas por fecha no numérica.`);
      }
    }

    setData(sample);
