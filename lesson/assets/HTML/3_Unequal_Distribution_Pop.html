<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unequal Distribution of Population</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        table { width: 80%; margin: auto; border-collapse: collapse; font-size: 1.1em; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background-color: #f2f2f2; }
        .america { background-color: #cce5ff; }  /* Light Blue */
        .asia { background-color: #d4edda; }  /* Light Green */
        .africa { background-color: #fff3cd; }  /* Light Yellow */
        .europe { background-color: #f8d7da; }  /* Light Red */
    </style>
</head>
<body>

    <h2>Unequal Distribution of Population</h2>
    <table>
        <thead>
            <tr>
                <th>Region</th>
                <th>Surface Area (%)</th>
                <th>Population (%)</th>
            </tr>
        </thead>
        <tbody>
            <tr class="america">
                <td>America</td>
                <td>30%</td>
                <td>13%</td>
            </tr>
            <tr class="asia">
                <td>Asia/Oceania</td>
                <td>30%</td>
                <td>60%</td>
            </tr>
            <tr class="africa">
                <td>Africa</td>
                <td>20%</td>
                <td>13%</td>
            </tr>
            <tr class="europe">
                <td>Europe</td>
                <td>20%</td>
                <td>13%</td>
            </tr>
        </tbody>
    </table>

</body>
</html>

of the 85 million people by which the world population increases each year, 50% correspond to Asia, and the 40% to Africa.
