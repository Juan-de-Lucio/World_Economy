<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logarithm Properties</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff; /* Fondo blanco */
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            border: 2px solid black; /* Añade borde negro */
        }
        p {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <p>ln(a·b) = ln(a) + ln(b)</p>
    <p>ln(a/b) = ln(a) - ln(b)</p>
    <p>ln(aⁿ) = n·ln(a)</p>
    <p>ln(1) = 0, ln(e) = 1</p>
    <p>ln(x) ≈ x when x → 0</p>
</div>

</body>
</html>
