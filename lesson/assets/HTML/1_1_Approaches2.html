<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacked Bar Charts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: space-around;
            padding: 20px;
        }
        .chart-container {
            width: 30%;
            text-align: center;
        }
        .bar {
            display: flex;
            flex-direction: column-reverse;
            width: 100%;
            height: 300px;
            border: 1px solid #ccc;
            margin: auto;
        }
        .segment {
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .income-labour { background-color: #6fa8dc; height: 47.1%; }
        .demand-investment { background-color: #f6b26b; height: 21.9%; }
        .demand-consumption { background-color: #6fa8dc; height: 76.1%; }
        .demand-export-import { background-color: #b7b7b7; height: 2%; }

        .income-firms { background-color: #f6b26b; height: 42.4%; }
        .income-tax-production { background-color: #b7b7b7; height: 10.5%; }

        .supply-agriculture { background-color: #6fa8dc; height: 2.6%; }
        .supply-industry { background-color: #f6b26b; height: 16%; }
        .supply-construction { background-color: #b7b7b7; height: 5.9%; }
        .supply-services { background-color: #ffab40; height: 65.9%; }
        .supply-tax { background-color: #1e88e5; height: 9.5%; }

        .chart-title {
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- Demand - expenditure -->
    <div class="chart-container">
        <div class="bar">
            <div class="segment demand-consumption">Consumption; 75.5%</div>
            <div class="segment demand-investment">Investment; 20.6%</div>
            <div class="segment demand-export-import">Export-Import; 3.9%</div>
        </div>
        <div class="chart-title">Demand - expenditure</div>
    </div>

    <!-- Income - rents -->
    <div class="chart-container">
        <div class="bar">
            <div class="segment income-labour">Labour; 48.8</div>
            <div class="segment income-firms">Firms; 41.3%</div>
            <div class="segment income-tax-production">Net tax production; 9.9%</div>
        </div>
        <div class="chart-title">Income - rents</div>
    </div>

    <!-- Production - Supply - Output -->
    <div class="chart-container">
        <div class="bar">
            <div class="segment supply-tax">Tax on products; 9.0%</div>
            <div class="segment supply-services">Services; 68,9%</div>
            <div class="segment supply-construction">Construction; 5.1%</div>
            <div class="segment supply-industry">Industry; 14.4%</div>
            <div class="segment supply-agriculture">Agriculture; 2.4%</div>
        </div>
        <div class="chart-title">Production - Supply - Output</div>
    </div>
</body>
</html>
