<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Number Calculator</title>
    <script>
        function calculateIndexNumber() {
            let baseYearValue = parseFloat(document.getElementById("baseYearValue").value) || 0;
            let currentYearValue = parseFloat(document.getElementById("currentYearValue").value) || 0;

            if (baseYearValue <= 0 || currentYearValue <= 0) {
                document.getElementById("result").innerText = "Please enter valid positive numbers.";
                return;
            }

            let indexNumber = (currentYearValue / baseYearValue) * 100;
            document.getElementById("result").innerText = "Index Number: " + indexNumber.toFixed(2);
        }
    </script>
</head>
<body>
    <h2>Index Number Calculator</h2>
    <p><strong>Instructions:</strong> Enter the value for the base year and the current year to calculate the index number.</p>
    
    <label for="baseYearValue">Base Year Value: </label>
    <input type="number" id="baseYearValue" value="100"><br><br>
    
    <label for="currentYearValue">Current Year Value: </label>
    <input type="number" id="currentYearValue" value="120"><br><br>
    
    <button onclick="calculateIndexNumber()">Calculate Index Number</button>
    
    <h3>Result:</h3>
    <p id="result">Index Number: --</p>
</body>
</html>
